<!DOCTYPE html>
<html>
<head>
    <title>Calculate Change</title>
</head>
<body>

<h2>Calculate Change</h2>

<label>Enter Amount:</label>
<input type="number" id="amount">
<button onclick="calculateChange()">Calculate</button>

<p id="result"></p>

<script>
function calculateChange() {

    let amount = parseInt(document.getElementById("amount").value);

    let notes = [1000, 500, 100, 50, 20, 10, 5, 2, 1];

    let output = "";

    for (let i = 0; i < notes.length; i++) {

        let count = Math.floor(amount / notes[i]);

        if (count > 0) {
            output += count + " of " + notes[i] + " Baht<br>";
            amount = amount % notes[i];

        
        }
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
