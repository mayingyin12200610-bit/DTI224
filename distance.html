<!DOCTYPE html>
<html>
<head>
    <title>How far From University?</title>
</head>
<body>

    <h2>How far from University?</h2>

    <label>Enter X Coordinate:</label>
    <input type="number" id="x">
    <br><br>

    <label>Enter Y Coordinate:</label>
    <input type="number" id="y">
    <br><br>

    <button onclick="calculateDistance()">Calculate</button>
    <button onclick="goBack()">Back</button>

    <hr>

    <p id="result"></p>

    <script>

        function calculateDistance() {

            let x = document.getElementById("x").value;
            let y = document.getElementById("y").value;

            // Validation
            if (x == "" || y == "") {
                alert("Please enter both X and Y coordinates.");
                return;
            }

            x = parseFloat(x);
            y = parseFloat(y);

            let distance = Math.sqrt((x * x) + (y * y));

            document.getElementById("result").innerHTML =
                "<b>Distance from University:</b> " +
                distance.toFixed(2) + " units";

        }

        function goBack() {
            history.back();
        }

    </script>

</body>
</html>
